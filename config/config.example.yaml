# ARCP 範例設定(可直接跑;rawcli-only、無 openhands venv 依賴)。
# 新使用者從這份起步:複製成 config.yaml、改 jql/project/profile 即可。
# CI 也用這份(ARCP_CONFIG=config.example.yaml)——不依賴本機才有的 venv。
version: 1

outer_loop:
  source:
    name: example
    project: SCRUM
    poll_interval_sec: 30
    jql: 'project = SCRUM AND statusCategory != Done ORDER BY created ASC'
    # jira_base_url: https://your-org.atlassian.net   # 非機密;不設則用 ~/.env 的
    #                                # JIRA_BASE_URL(email/token 一律只在 ~/.env)
    write_retry: {max: 5, base_sec: 1}
    # cancel_status: Cancelled     # triage(select)回 notfound → 中止時,Jira 想轉的取消
    #                              # 狀態名(workflow 相關);沒有則優雅退回一般結案(done)

  concurrency:
    max_running: 2
    per_engine: {claude: 2, codex: 1}
    per_profile: {}

  budget:                          # 全站月度上限(只管理者能改 + hot reload;見 budget.md)
    monthly_max_usd: 500.0
    monthly_max_tokens: 200000000

  control:
    host: 127.0.0.1
    port: 8787

  form:
    host: 127.0.0.1
    port: 8790

  routes:
    - name: hands-off
      when: {labels: ['arcp.no-agent']}
      on_match: ignore
    - name: agent-labeled
      when: {labels: ['arcp.agent']}
      profile: default
      on_match: create_or_resume

inner_loop:
  profiles:
    default:
      goal: '完成 ticket 描述交付的任務並通過驗證'
      budget:                        # token/usd 上限(見 docs/design/budget.md)
        ticket_soft_usd: 1.0         # 單票軟上限:破 → 使用者可自助增額(≤hard)
        ticket_hard_usd: 3.0         # 單票硬上限:只管理者能改
        ticket_soft_tokens: 300000   # token 同理(claude/codex 都量得到)
        ticket_hard_tokens: 800000
        monthly_max_usd: 50.0        # 月/此 agent 硬上限(只管理者能改)
        monthly_max_tokens: 20000000
      human_minutes_est: 30          # KPI 節省人時估算
      # auto_close: off              # off(預設,正常 HIL 人評分)| on_success(只成功自動關)
      #                              | all(全終態自動關,無人值守);自動關時 human_score=agent 自評
      workspace:
        template: empty              # empty | <name>_template(config/templates/ 下,整包 copytree)
        folder: 'tickets/{issue_id}'
        # --- 進階佈建(docs/design/workspace.md;預設都關/空)---
        # install: 'uv run install.py'   # 設了就用命令佈建(不 copytree);ARCP 附 <ws> <template> 兩參數
        # common_skills: [example-skill] # 從 config/skills/ 選子集,複製到 ws 的 skills 目錄
        # common_hooks: [example-hook]   # 從 config/hooks/ 選子集,複製到 ws 的 hooks 目錄
        # inject_md: true                # 是否把 config/templates/inject_claude_md_end.md 貼到 CLAUDE.md/AGENTS.md 尾
      skills: []                    # 舊式逐檔 SKILL.md(相容;新專案用 common_skills)
      # --- Q16 profile 選擇(A/B 測試 / 泛化 triage;首次派工選一次、鎖定進 session)---
      # select:
      #   candidates: [default_v2]     # 候選 profile 名,prefix 須 = 本 profile 名;本 profile 自動納入池
      #   method: random               # random(隨機分流)| script(條件式)
      #   script: 'uv run select.py'   # method=script:JSON stdin(ticket/crid/候選+yaml)→ stdout 回 profile 名
      agent:
        backend: rawcli              # 純 stdlib,無需 openhands venv
        engine: claude               # claude | codex
        model: haiku                 # 測試省成本;真實任務可改 sonnet/opus
        os_sandbox: true
        sandbox: workspace-write
        timeout_sec: 300
      verify:
        - name: task-done
          files:
            DONE.md:                 # 確定性檢查:產出 DONE.md(任何內容)才算 SUCCESS
      loop:
        max_attempts: 3
        on_unknown: pending
