name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync deps (editable arcp + dev)
        run: uv sync --extra dev

      - name: Ruff (lint + import order)
        run: uv run ruff check .

      - name: Build (wheel + sdist)
        run: uv build

      # 只跑「離線」測試:單元 + harness_selftest + dashboard/form e2e。
      # 排除需真 Jira/真 agent/openhands 的測試(smoke_jira、e2e_c*、e2e_codex…)
      - name: Offline tests
        working-directory: harness
        env:
          # CI/fresh checkout 沒有 openhands venv;detail_server(/agent 頁)用不依賴
          # venv 的範例設定載入 profiles。harness_selftest 另硬編 routes.yaml(僅 routing,
          # load_config 不驗 venv,故不受影響)。
          ARCP_CONFIG: routes.example.yaml
        run: |
          set -e
          for t in test_*.py; do echo "== $t =="; uv run python "$t"; done
          uv run python harness_selftest.py
          uv run python e2e_dashboard.py
          uv run python e2e_form.py
