# Outer-loop routing (v5 C1/D2): 只決定「歸哪個 profile / 何時接管 / 何時交還」。
# 禁止出現 steps:/then: 之類的步驟序列 —— loader 會直接拒絕(C1 護欄)。
version: 1

outer_loop:
  source:
    project: SCRUM
    poll_interval_sec: 30
    jql: 'project = SCRUM AND statusCategory != Done ORDER BY created ASC'
    write_retry: {max: 5, base_sec: 1}   # A3(N8):寫入撞 429/5xx 指數退避
    # bot_account_id: '...'   # 可選(W12):機器人 accountId;不填→啟動 myself() 解析

  # 併發/分層資源閘門(F1,v5 D10):怕系統不夠用,管制同時跑的 agent 數
  concurrency:
    max_running: 4                     # 全局:一輪最多幾張票並行
    per_engine: {claude: 3, codex: 2}  # 各引擎進程上限(機器 CPU/memory)
    per_profile: {}                    # 可選:個別 profile 上限

  # W2.6 控制面(REST,只綁本機):GET /status /health;POST /pause /resume /reload
  control:
    host: 127.0.0.1
    port: 8787

  # Phase 3:指令通道與外部變更政策
  commands:
    allowed_commenters: ['Shao-wei Chen']   # displayName 或 accountId(§6-13)
  external_change:
    cancel_states: ['完成', 'Done', 'Cancelled']  # 人 out-of-band 關票 = 撤銷

  routes:
    # 由上而下第一個 match 勝出;when 內欄位 AND、陣列值 OR
    - name: hands-off
      when:
        labels: ['no-agent']
      on_match: ignore

    - name: agent-labeled
      when:
        labels: ['agent']
      profile: default
      on_match: notify_only          # 灰度:只記 route_matched,不接管

    - name: filechain-server        # B+.2:走 agent-server backend(GUI/detail 可見)
      when:
        labels: ['filechain-server']
      profile: filechain-server
      on_match: create_or_resume

    - name: filechain-rawcli         # C.3:走 rawcli backend(RawCLIAgent,細粒度)
      when:
        labels: ['filechain-rawcli']
      profile: filechain-rawcli
      on_match: create_or_resume

    - name: filechain-codex          # W3.1(D2):rawcli 第二引擎(codex exec)
      when:
        labels: ['filechain-codex']
      profile: filechain-codex
      on_match: create_or_resume

    - name: filechain-demo          # Phase 2 M2:第一條會「動手」的 route
      when:
        labels: ['filechain']
      profile: filechain
      on_match: create_or_resume

    - name: triage-keyword
      when:
        summary: '(?i)\b(triage|bug|fix|crash)\b'
      profile: triage
      on_match: notify_only
      comments_lookback: 5

    - name: fault-retry             # fault-injection:驗證 retry+evidence 迴路
      when:
        labels: ['faultretry']
      profile: faultretry
      on_match: create_or_resume

    - name: fault-dead              # fault-injection:驗證 UNKNOWN 路徑
      when:
        labels: ['faultdead']
      profile: faultdead
      on_match: create_or_resume

    - name: cmd-demo                # Phase 3:指令通道 E2E 用
      when:
        labels: ['cmddemo']
      profile: faultdead            # 10s timeout → 快速進 pending:unknown
      on_match: create_or_resume

    - name: approval-demo           # W2a 真 Jira 實測:審批門 + human_email
      when:
        labels: ['approval-demo']
      profile: approval-demo
      on_match: create_or_resume

    - name: handoff-demo            # W2.5 真 Jira 實測:G1 handoff kind=human
      when:
        labels: ['handoff-demo']
      profile: handoff-demo
      on_match: create_or_resume

# Inner loop(v5 §4.2):profile 決定 workspace/skills/agent/verify/loop。
# agent: 區塊獨立 —— B→C 換執行單元只改這一塊(B 期守則 2)。
inner_loop:
  profiles:
    filechain:
      workspace:
        template: empty
        folder: 'tickets/{issue_id}'
      skills: []
      agent:                        # ★ B→C 只換這塊
        backend: openhands-acp
        acp_server: claude-code
        acp_model: haiku            # 使用者決策:A/B 同款 model
        venv: ../examples/openhands-acp-poc/.venv
        timeout_sec: 300

    # 同 filechain,但走 agent-server backend(B+.1)——conversation 存 server,
    # GUI 看得到。envelope 契約與 in-process 版相同,dispatcher 不變。
    filechain-server:
      workspace:
        template: empty
        folder: 'tickets/{issue_id}'
      skills: []
      agent:
        backend: openhands-server   # ← 唯一差別
        acp_server: claude-code
        acp_model: haiku
        venv: ../examples/openhands-acp-poc/.venv
        timeout_sec: 300

    # 同 filechain,但走 rawcli backend(C.3)——RawCLIAgent 直接 spawn claude -p,
    # 細粒度事件 + 原生流全保真。envelope 契約相同,dispatcher/grader 零改動。
    filechain-rawcli:
      workspace:
        template: empty
        folder: 'tickets/{issue_id}'
      skills: []
      agent:
        backend: rawcli             # ← 唯一差別
        engine: claude              # claude | codex
        model: haiku                # 測試省成本;model opus 已驗證可用(SCRUM-12
                                    # SUCCESS $0.279 vs haiku $0.035,~8x)——
                                    # 真實任務改這一行即可,rawcli/harness 零改動
        os_sandbox: true            # 執行隔離:claude 用 macOS seatbelt 限制
                                    # 檔案寫入只能到 workspace(codex 用內建
                                    # --sandbox=workspace-write,見 sandbox:)
        sandbox: workspace-write    # codex --sandbox: read-only|workspace-write
        venv: ../examples/openhands-acp-poc/.venv
        timeout_sec: 300
      verify:                       # 確定性檢查,全過才 SUCCESS
        - name: filechain
          files:
            step1.txt: '1'
            step2.txt: '12'
            step3.txt: '123'
      loop:
        max_attempts: 2
        on_unknown: pending         # 不可改 retry(v5 D3)

    # fault-injection 專用:verify 要求 ticket 沒提的 extra.txt →
    # attempt 1 必敗 → 失敗證據餵回 attempt 2(native resume)→ 補齊
    faultretry:
      workspace:
        template: empty
        folder: 'tickets/{issue_id}'
      skills: []
      agent:
        backend: openhands-acp
        acp_server: claude-code
        acp_model: haiku
        venv: ../examples/openhands-acp-poc/.venv
        timeout_sec: 300
      verify:
        - name: chain-plus-extra
          files:
            step1.txt: '1'
            extra.txt: null        # existence-only:missing-file feedback 不含
                                   # expected content,agent 無從得知(lesson #10)
      loop:
        max_attempts: 2
        on_unknown: pending

    # W3.1(D2):同 filechain-rawcli 但 engine=codex——驗雙引擎同 envelope
    # 契約。model 不填=用 codex 帳號預設(claude 的 model 名不適用於 codex);
    # 隔離用 codex 內建 --sandbox workspace-write(os_sandbox 對 codex 是 no-op)。
    filechain-codex:
      workspace:
        template: empty
        folder: 'tickets/{agent}__{key}__{issue_id}'
      skills: []
      agent:
        backend: rawcli
        engine: codex
        sandbox: workspace-write
        venv: ../examples/openhands-acp-poc/.venv
        timeout_sec: 300
      verify:
        - name: filechain
          files:
            step1.txt: '1'
            step2.txt: '12'
            step3.txt: '123'
      loop:
        max_attempts: 2
        on_unknown: pending

    # W2a 真 Jira 實測:審批門(貼 plan→人填表→放行→fork)+ human_email 解析。
    # 任務極小(建 done.txt)、haiku 省成本;approver=人類帳號(email,啟動時
    # user-search 解析成 accountId)。
    approval-demo:
      workspace:
        template: empty
        folder: 'tickets/{agent}__{key}__{issue_id}'
      skills: []
      agent:
        backend: rawcli
        engine: claude
        model: haiku
        os_sandbox: true
        venv: ../examples/openhands-acp-poc/.venv
        timeout_sec: 300
      verify:
        - name: done-file
          files:
            done.txt: null         # existence-only
      approval:
        required: true
        approver: swchen44@gmail.com
        max_revisions: 3
      loop:
        max_attempts: 2
        on_unknown: pending

    # W2.5 真 Jira 實測:G1 handoff kind=human。agent 自報 handoff(G1 契約
    # output_schema)→ dispatcher 轉人類:human_email→approver fallback 指派。
    handoff-demo:
      workspace:
        template: empty
        folder: 'tickets/{agent}__{key}__{issue_id}'
      skills: []
      agent:
        backend: rawcli
        engine: claude
        model: haiku
        os_sandbox: true
        output_schema: true        # G1 契約:回報 {reason,status,next}
        venv: ../examples/openhands-acp-poc/.venv
        timeout_sec: 300
      verify:
        - name: never-reached      # handoff 在 grade 前返回,不會用到
          files:
            done.txt: null
      approval:
        required: false
        approver: swchen44@gmail.com   # handoff kind=human 的 assignee fallback
      loop:
        max_attempts: 2
        on_unknown: pending

    # fault-injection 專用:timeout 短於 ACP 啟動 → runner 死 → UNKNOWN
    faultdead:
      workspace:
        template: empty
        folder: 'tickets/{issue_id}'
      skills: []
      agent:
        backend: openhands-acp
        acp_server: claude-code
        acp_model: haiku
        venv: ../examples/openhands-acp-poc/.venv
        timeout_sec: 10
      verify:
        - name: never
          files:
            never.txt: 'x'
      loop:
        max_attempts: 2
        on_unknown: pending
