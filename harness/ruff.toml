# ARCP lint 設定(W2.1 / W16)。量產會另開 repo;此處選「核心集」讓新碼 clean,
# 不啟用偏好/激進規則(SIM/BLE/EXE/S/FURB/PLW/UP/C…那些是風格偏好,非 bug)。
line-length = 88
target-version = "py311"

[lint]
select = ["E", "F", "W", "I"]   # pycodestyle(E/W)+ pyflakes(F)+ isort(I)
ignore = [
    "E402",  # module-import-not-at-top:sys.path.insert 後才 import 是有意的
]

[lint.per-file-ignores]
# 核心套件 arcp_harness/ 維持嚴格;測試/e2e/舊頂層腳本 print-heavy,放寬行長/分號/
# 命名(量產另開 repo 不帶走;detail_server 待 W2.7 擴充時重構)。
"test_*.py" = ["E501", "E702"]
"e2e_*.py" = ["E501", "E702", "E741"]
"detail_server.py" = ["E501", "E702", "E741"]
"harness_selftest.py" = ["E501", "E702", "E741"]
"spike_c0.py" = ["E501", "E702", "E741"]
"smoke_jira.py" = ["E501", "E702", "E741"]
"demo_concurrent.py" = ["E501", "E702", "E741"]
