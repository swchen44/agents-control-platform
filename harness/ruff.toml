# ARCP lint 設定(W2.1 / W16)。量產會另開 repo;此處選「核心集」讓新碼 clean,
# 不啟用偏好/激進規則(SIM/BLE/EXE/S/FURB/PLW/UP/C…那些是風格偏好,非 bug)。
line-length = 88
target-version = "py311"

# W6.8:絕不碰 vendored 第三方碼(zero-diff vendor,見各自 NOTICE)。
# 沒這行的話,`ruff check --fix` 會把 cclog 上游套件的 import 重排,破壞 zero-diff。
# 實測:用 `**/…/**` glob 才可靠剪枝(父目錄字串 ruff 不剪);render_transcript.py
# 是我們自寫的 wrapper(不在 claude_code_log/ 內),仍受檢。
extend-exclude = [
    "**/claude_code_log/**",   # cclog 上游套件(MIT,zero-diff vendor)
    "**/tools/vendor/**",      # swagger-ui / vis-timeline(zero-diff vendor)
]
# pre-commit hook 會把「明確檔案路徑」丟給 ruff,預設對明確傳入的檔不套 exclude
# → vendored 會漏網。force-exclude 讓 exclude 對明確路徑也生效(ruff 官方對 pre-commit
# 的建議設定)。
force-exclude = true

[lint]
select = ["E", "F", "W", "I"]   # pycodestyle(E/W)+ pyflakes(F)+ isort(I)
ignore = [
    "E402",  # module-import-not-at-top:sys.path.insert 後才 import 是有意的
]

[lint.isort]
# W6.8:明確宣告 harness 自己的本地套件,讓 import 分類不依賴 ruff 執行時的
# cwd/src 自動偵測。根因:W5.5 把 arcp_rawcli 從 module 改成套件後,自動偵測才把
# 它歸 first-party、觸發一次重排(那批 dirty 檔的由來)。寫死 → 之後升 ruff/換機器
# 都排一致。arcp_poc 住 examples/(不在 harness/ 下)不列——ruff 恆判它第三方,
# 已穩定,列進來反而讓已定案的 e2e import 再洗一次牌。
known-first-party = ["arcp_harness", "arcp_rawcli"]

[lint.per-file-ignores]
# 核心套件 arcp_harness/ 維持嚴格;測試/e2e/舊頂層腳本 print-heavy,放寬行長/分號/
# 命名(量產另開 repo 不帶走;detail_server 待 W2.7 擴充時重構)。
"test_*.py" = ["E501", "E702"]
"e2e_*.py" = ["E501", "E702", "E741"]
"detail_server.py" = ["E501", "E702", "E741"]
"harness_selftest.py" = ["E501", "E702", "E741"]
"spike_c0.py" = ["E501", "E702", "E741"]
"smoke_jira.py" = ["E501", "E702", "E741"]
"demo_concurrent.py" = ["E501", "E702", "E741"]
